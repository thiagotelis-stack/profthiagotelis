<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thiago Telis | Links</title>
<meta name="description" content="Thiago Telis — educação, concursos, Jurisprudência Descomplicada, Trilhando Concursos e contato direto.">
<meta name="theme-color" content="#f7f2e9">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#171717;
  background:
    radial-gradient(circle at 16% 8%,rgba(49,201,99,.10),transparent 26%),
    radial-gradient(circle at 88% 18%,rgba(255,198,26,.11),transparent 24%),
    linear-gradient(160deg,#faf8f3 0%,#f4efe7 52%,#f7f4ef 100%);
  display:flex;justify-content:center;align-items:center;padding:30px 18px;
}
.wrap{width:min(100%,540px)}
.profile{text-align:center;margin-bottom:26px}
.photo{
  width:124px;height:124px;margin:0 auto 14px;border-radius:50%;
  object-fit:cover;object-position:center 11%;
  border:5px solid rgba(255,255,255,.92);
  box-shadow:0 15px 40px rgba(44,34,24,.15);
}
h1{margin:0;font-size:31px;line-height:1.05;letter-spacing:-.9px}
.handle{margin-top:6px;color:#7c766f;font-size:15px}
.tagline{
  margin:15px auto 0;max-width:390px;font-size:16px;line-height:1.5;
  color:#4d4944;font-weight:520;
}
.divider{height:2px;width:64px;border-radius:99px;margin:18px auto 0;background:#d2cbc1}
.links{display:grid;gap:14px;margin-top:24px}
.card{
  text-decoration:none;color:inherit;border-radius:22px;padding:16px 18px;display:flex;gap:15px;align-items:center;
  border:1px solid rgba(35,32,28,.08);background:rgba(255,255,255,.86);
  box-shadow:0 8px 26px rgba(50,40,30,.06);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;
}
.card:hover{transform:translateY(-2px);box-shadow:0 13px 30px rgba(50,40,30,.09)}
.logo{
  width:54px;height:54px;flex:0 0 54px;border-radius:16px;display:grid;place-items:center;overflow:hidden;
}
.logo img{width:100%;height:100%;object-fit:contain}
.jd .logo{background:#f3fff6;padding:7px;border:1px solid #d8f4e1}
.tr .logo{background:#111;padding:3px;border:1px solid #111}
.wa .logo{background:#f2f2f2;border:1px solid #e4e4e4}
.text{flex:1;min-width:0}
.title{font-size:17px;font-weight:780;letter-spacing:-.2px}
.desc{margin-top:4px;color:#77716b;font-size:13.5px;line-height:1.38}
.arrow{font-size:23px;padding-left:4px;color:#9b958e}
.jd{border-left:4px solid #31c963}
.jd .arrow{color:#1c6054}
.tr{border-left:4px solid #FFC61A}
.tr .arrow{color:#a77b00}
.wa{border-left:4px solid #222}
.wa .arrow{color:#222}
@media(max-width:420px){
  body{padding:22px 14px}
  .photo{width:112px;height:112px}
  h1{font-size:28px}
  .tagline{font-size:15px}
  .card{padding:15px}
  .logo{width:50px;height:50px;flex-basis:50px}
  .title{font-size:16px}
}
</style>
</head>
